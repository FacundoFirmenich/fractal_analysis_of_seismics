[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seismic-fractal-analysis"
version = "1.0.0"
description = "Python framework for fractal dimension analysis of earthquake spatial distributions"
readme = "README.md"
authors = [
  { name="Facundo Firmenich", email="f.firmenich@cedesur.org" },
  { name="Pau Firmenich" },
  { name="León Firmenich" },
]
maintainers = [
  { name="Facundo Firmenich", email="f.firmenich@cedesur.org" },
]
license = { file = "LICENSE" }
keywords = [
    "seismology",
    "fractal-dimension",
    "bayesian-inference",
    "spatial-analysis",
    "earthquake-physics",
    "correlation-dimension",
    "multifractal",
    "graph-theory",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"

dependencies = [
    # Core scientific computing
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    
    # Visualization
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    "kaleido>=0.2.1",
    
    # Network analysis
    "networkx>=2.6.0",
    "igraph>=0.11.0",
    "leidenalg>=0.10.0",
    
    # Machine learning
    "scikit-learn>=1.0.0",
    
    # Data acquisition
    "requests>=2.26.0",
    
    # Parallel computing
    "joblib>=1.1.0",
    
    # Web deployment
    "streamlit>=1.28.0",
]

[project.optional-dependencies]
performance = [
    "numba>=0.56.0",  # JIT compilation 3-20× speedup
    "cython>=0.29.0",  # Extension modules
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]
docs = [
    "sphinx>=4.5.0",
    "sphinx-rtd-theme>=1.0.0",
    "nbsphinx>=0.8.0",
]
all = [
    "seismic-fractal-analysis[performance,dev,docs]",
]

[project.urls]
"Homepage" = "https://github.com/FacundoFirmenich/fractal_analysis_of_seismics"
"Documentation" = "https://github.com/FacundoFirmenich/fractal_analysis_of_seismics/tree/main/docs"
"Bug Tracker" = "https://github.com/FacundoFirmenich/fractal_analysis_of_seismics/issues"
"Source Code" = "https://github.com/FacundoFirmenich/fractal_analysis_of_seismics"
"Publication" = "https://doi.org/10.5281/zenodo.XXXXXXX"  # Update with actual DOI

[project.scripts]
sfa-analyze = "sfa.cli:main"
sfa-visualize = "sfa.vis:main"

[tool.setuptools]
packages = ["sfa"]
include-package-data = true

[tool.setuptools.package-data]
sfa = ["data/*.csv", "config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=sfa --cov-report=html --cov-report=term"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
